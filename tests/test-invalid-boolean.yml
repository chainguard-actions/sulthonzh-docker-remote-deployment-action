name: Test invalid boolean input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupSMoYMSBNMnG\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          docker_prune: "yes"
      - name: Assert action failed due to invalid boolean value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid boolean 'yes' for docker_prune, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid boolean value"
