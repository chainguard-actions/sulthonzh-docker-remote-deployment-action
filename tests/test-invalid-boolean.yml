name: Test non-boolean docker_prune is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: deploy@127.0.0.1
          ssh_public_key: dummy-public-key
          ssh_private_key: dummy-private-key
          args: up -d
          docker_prune: "yes"
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for docker_prune=yes"
            exit 1
          fi
          echo "PASS"
