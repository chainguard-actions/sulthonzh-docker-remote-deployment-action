name: Test non-boolean docker_prune is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate throwaway SSH key pair
        id: keys
        run: |
          rm -f /tmp/test_key /tmp/test_key.pub
          ssh-keygen -t ed25519 -N "" -f /tmp/test_key -q
          {
            echo "private<<EOF_PRIVATE_KEY"
            cat /tmp/test_key
            echo "EOF_PRIVATE_KEY"
            echo "public=$(cat /tmp/test_key.pub)"
          } >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: deploy@127.0.0.1
          ssh_public_key: ${{ steps.keys.outputs.public }}
          ssh_private_key: ${{ steps.keys.outputs.private }}
          args: version
          docker_prune: "yes"
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for docker_prune=yes"
            exit 1
          fi
          echo "PASS"
