name: Test private registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test-private-registry-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@nonexistent.example.com
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: docker-compose
          docker_registry_username: testuser
          docker_registry_password: testpassword
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action ran (failed due to connection, not input rejection)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with docker_registry_username and docker_registry_password inputs"
