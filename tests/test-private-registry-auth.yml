name: Test private registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myuser'
          docker_registry_password: 'mysecretpassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action ran (failed at SSH, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because SSH connection to 192.0.2.1 is not possible,
          # but it must have accepted the registry credentials as valid inputs.
          # Any outcome (failure due to SSH) is acceptable here — we just verify
          # the action was invoked with the registry inputs covered.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with docker_registry_username and docker_registry_password inputs"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
