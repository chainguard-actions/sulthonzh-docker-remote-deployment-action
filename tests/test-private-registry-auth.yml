name: Test private registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleQ==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action ran (failed due to no real SSH host, which is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because there is no real SSH host reachable.
          # We only need to confirm the action was invoked (not skipped/cancelled)
          # and that the registry inputs were accepted (not rejected by validation).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with docker_registry_username and docker_registry_password inputs"
