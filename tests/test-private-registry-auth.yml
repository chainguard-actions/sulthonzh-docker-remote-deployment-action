name: Test private registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with private registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCKBSMDGMdBCBFJO
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'
      - name: Assert action ran with registry credentials provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because it cannot connect to a real SSH host.
          # What matters is that the action accepted the registry credential inputs
          # (i.e. it did not fail due to input validation of those fields).
          # A failure here means the action rejected the inputs themselves.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "PASS: action failed at SSH connection stage (registry inputs were accepted)"
          fi
          echo "PASS"
