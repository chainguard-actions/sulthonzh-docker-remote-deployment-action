name: Test private registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with private registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: docker-compose
          docker_registry_username: myuser
          docker_registry_password: mysecretpassword
          docker_registry_uri: 'https://registry.hub.docker.com'
      - name: Assert action ran (inputs were accepted, failure expected at SSH stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because there is no real remote host,
          # but it must NOT be skipped — it must have been invoked with the inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs were not processed"
            exit 1
          fi
          echo "PASS: action was invoked with docker_registry_username and docker_registry_password inputs"
