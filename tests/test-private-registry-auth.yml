name: Test Private Registry Authentication Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry credentials (expect failure at SSH stage)
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@192.0.2.1'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakeprivatekey
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action failed (SSH connection to fake host expected to fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to unreachable host with fake SSH key"
            exit 1
          fi
          echo "PASS: action correctly failed at SSH connection stage (registry inputs were accepted)"
