name: Test invalid docker registry username validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with injection characters in registry username
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@remotehost'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMPBFBMHFMFHMFHMF
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          docker_registry_username: 'user;rm -rf /'
          docker_registry_password: 'somepassword'
      - name: Assert action failed with invalid registry username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid registry username containing injection characters"
            exit 1
          fi
          echo "PASS: action correctly rejected registry username with dangerous characters"
