name: Test valid inputs with unreachable SSH host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'deploy@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakeprivatekey
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_prune: 'false'
          copy_stack_file: 'false'
          pull_images_first: 'false'
          prune_volumes: 'false'
          keep_files: '4'
      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable (192.0.2.1 is TEST-NET, RFC 5737)
          # but it must have passed all input validation to reach the SSH stage.
          # Either failure (SSH error) or success is acceptable — what matters is it didn't
          # fail due to input validation rejecting valid inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at SSH connection stage (input validation passed)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (input validation passed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
