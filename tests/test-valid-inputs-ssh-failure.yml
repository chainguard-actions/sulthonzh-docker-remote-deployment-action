name: Test valid inputs pass validation (fails at SSH connection)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid inputs (no real SSH host)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'deploy@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCGFMpYGFMKMBqMoFN
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          stack_file_name: 'docker-compose.yml'
          keep_files: '4'
          docker_prune: 'false'
          copy_stack_file: 'false'

      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no real SSH host at 192.0.2.1
          # (TEST-NET address per RFC 5737, guaranteed unreachable).
          # If it fails, that means validation passed and it got to the SSH/Docker stage.
          # We just verify it did not succeed (which would require a real host).
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without a real remote host"
            exit 1
          fi
          echo "PASS: action failed at SSH/Docker connection stage as expected (validation passed)"
