name: Test valid inputs proceed to SSH stage (expected SSH failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with valid inputs but unreachable host
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          keep_files: '4'
      - name: Assert action failed (expected — SSH to unreachable host)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable (192.0.2.1 is TEST-NET, RFC 5737)
          # but it must NOT fail due to input validation — all inputs are valid.
          # Any failure here is acceptable (SSH failure is expected), but the action must not succeed.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded connecting to an unreachable host"
            exit 1
          fi
          echo "PASS: action failed as expected (SSH connection to unreachable host)"
