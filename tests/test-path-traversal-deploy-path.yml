name: Test path traversal rejected in deploy_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with path traversal in deploy_path
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@somehost'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCTBMFBsRMBSMkMkMk
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          deploy_path: '/opt/../etc/passwd'

      - name: Assert action failed with path traversal in deploy_path
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in deploy_path"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in deploy_path"
