name: Test path traversal prevention in deploy_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with path traversal in deploy_path (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCGFMFMFMFMFMFMFMF
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          deploy_path: '/home/user/../../etc/passwd'
      - name: Assert action failed due to path traversal in deploy_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when deploy_path contains path traversal"
            exit 1
          fi
          echo "PASS: action correctly rejected deploy_path with path traversal"
