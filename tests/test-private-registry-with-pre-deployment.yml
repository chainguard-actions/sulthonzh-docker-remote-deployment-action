name: Test private registry and pre-deployment command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry and pre-deployment args (expect failure at SSH stage)
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAMKAGDEMEMBERSHIPKEY\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          docker_registry_username: "myregistryuser"
          docker_registry_password: "myregistrypassword"
          docker_registry_uri: "https://registry.hub.docker.com"
          pre_deployment_command_args: "config"

      - name: Assert action failed (SSH connection failure is expected, not input validation failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH cannot connect to example.com), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (SSH connection to dummy host failed, inputs were accepted)"
