name: Test injection prevention in pre_deployment_command_args
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with shell injection in pre_deployment_command_args
        id: action_semicolon
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSaFMHfKFMCOFM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config;malicious'

      - name: Assert action failed with semicolon injection in pre_deployment_command_args
        env:
          OUTCOME: ${{ steps.action_semicolon.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon injection in pre_deployment_command_args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected semicolon injection in pre_deployment_command_args"

      - name: Run action with backtick injection in pre_deployment_command_args
        id: action_backtick
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSaFMHfKFMCOFM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config`id`'

      - name: Assert action failed with backtick injection in pre_deployment_command_args
        env:
          OUTCOME: ${{ steps.action_backtick.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with backtick injection in pre_deployment_command_args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected backtick injection in pre_deployment_command_args"
