name: Test path traversal prevention in deploy_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "public_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key.pub >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with path traversal in deploy_path
        id: action_traversal
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@somehost'
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: 'up -d'
          deployment_mode: 'docker-compose'
          deploy_path: '../../etc/passwd'

      - name: Assert action failed with path traversal
        run: |
          echo "outcome: ${{ steps.action_traversal.outcome }}"
          if [ "${{ steps.action_traversal.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in deploy_path, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in deploy_path"

      - name: Run action with absolute path in deploy_path
        id: action_absolute
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@somehost'
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: 'up -d'
          deployment_mode: 'docker-compose'
          deploy_path: '/etc/malicious'

      - name: Assert action failed with absolute path
        run: |
          echo "outcome: ${{ steps.action_absolute.outcome }}"
          if [ "${{ steps.action_absolute.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with absolute path in deploy_path, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly rejected absolute path in deploy_path"
