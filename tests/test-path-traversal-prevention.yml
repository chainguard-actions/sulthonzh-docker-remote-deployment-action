name: Test path traversal prevention
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with path traversal in deploy_path
        id: action_traversal
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deploy_path: '/opt/../../etc/passwd'

      - name: Assert action failed due to path traversal in deploy_path
        env:
          OUTCOME: ${{ steps.action_traversal.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in deploy_path, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in deploy_path"

      - name: Run action with path traversal in stack_file_name
        id: action_stack_traversal
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          stack_file_name: '../../etc/docker-compose.yml'

      - name: Assert action failed due to path traversal in stack_file_name
        env:
          OUTCOME: ${{ steps.action_stack_traversal.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in stack_file_name, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in stack_file_name"
