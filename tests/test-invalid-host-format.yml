name: Test invalid remote_docker_host format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid host format (no user@)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'just-a-hostname'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFBMFmMVMBMGMBMGM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed with host format error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid host format, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid host format"
