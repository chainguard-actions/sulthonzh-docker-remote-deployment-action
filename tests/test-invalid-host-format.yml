name: Test invalid remote_docker_host format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test 1: host without user@ prefix should fail validation
      - id: bad_host
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'just-a-hostname'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert bad host format was rejected
        env:
          OUTCOME: ${{ steps.bad_host.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid host format, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid host format"

      # Test 2: host with multiple @ signs should fail validation
      - id: multi_at_host
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host@extra'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert multi-at host format was rejected
        env:
          OUTCOME: ${{ steps.multi_at_host.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multi-@ host format, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected multi-@ host format"
