name: Test invalid remote_docker_host format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: invalidhostnoatsign
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC0fake test@example"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: up -d
          deployment_mode: docker-compose
      - name: Assert action failed with validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because remote_docker_host must be in format 'user@host'
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid host format"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected invalid host format"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
