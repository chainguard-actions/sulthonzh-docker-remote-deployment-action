name: Test invalid remote_docker_host format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid host format (no user@host)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'just-a-hostname-no-user'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
      - name: Assert action failed due to invalid host format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when remote_docker_host is not in user@host format"
            exit 1
          fi
          echo "PASS: action correctly failed when remote_docker_host format is invalid"
