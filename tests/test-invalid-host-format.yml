name: Test invalid remote_docker_host format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "public_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key.pub >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with invalid host format (no @ sign)
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'invalidhostformat'
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with invalid host format
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid host format, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid host format"
