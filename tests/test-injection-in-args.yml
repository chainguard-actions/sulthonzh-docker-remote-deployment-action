name: Test shell injection attempt in args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with injection characters in args
        id: action
        uses: .
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCGFMnFMBMCKAMbMbQ
            -----END RSA PRIVATE KEY-----
          args: 'up -d; rm -rf /'
        continue-on-error: true
      - name: Assert action failed due to injection characters
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when args contains shell injection characters"
            exit 1
          fi
          echo "PASS: action correctly rejected args with injection characters"
