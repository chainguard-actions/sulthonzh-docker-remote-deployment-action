name: Test shell injection prevention in args
on:
  workflow_dispatch:
jobs:
  test-injection-in-args:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with injection attempt in remote_docker_host
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host;rm -rf /'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed due to injection attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with injection in remote_docker_host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected injection attempt in remote_docker_host"
