name: Test docker-swarm mode with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in docker-swarm mode (will fail at SSH connection)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'deploy my-stack'
          deployment_mode: 'docker-swarm'
          stack_file_name: 'docker-compose.yml'

      - name: Assert action ran with docker-swarm mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no real SSH host,
          # but it should have accepted 'docker-swarm' as a valid deployment mode.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and accepted docker-swarm deployment mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
