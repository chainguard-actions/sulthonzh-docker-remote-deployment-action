name: Test port zero is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with port 0 (below valid range)
        id: action
        uses: .
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '0'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCGFMnFMBMCKAMbMbQ
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
        continue-on-error: true
      - name: Assert action failed with port 0
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when port is 0 (below valid range 1-65535)"
            exit 1
          fi
          echo "PASS: action correctly rejected port 0"
