name: Test docker-swarm deployment mode validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with docker-swarm mode and valid inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'deploy@192.0.2.1'
          remote_docker_port: '2222'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCGFMpYGFMKMBqMoFN
            -----END RSA PRIVATE KEY-----
          args: 'deploy my-stack'
          deployment_mode: 'docker-swarm'
          stack_file_name: 'docker-compose.yml'

      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no real SSH host at 192.0.2.1
          # (TEST-NET address per RFC 5737, guaranteed unreachable).
          # Validation should have passed for docker-swarm mode with valid inputs.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without a real remote host"
            exit 1
          fi
          echo "PASS: action failed at SSH/Docker connection stage as expected (swarm mode validation passed)"
