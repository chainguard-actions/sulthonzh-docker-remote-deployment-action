name: Test args command injection prevention
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with semicolon injection in args
        id: action_semicolon
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSaFMOqKCBFBhL
            -----END RSA PRIVATE KEY-----
          args: 'up -d; rm -rf /'
          deployment_mode: 'docker-compose'

      - name: Assert action failed due to semicolon injection
        env:
          OUTCOME: ${{ steps.action_semicolon.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon in args, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected args with semicolon"

      - name: Run action with pipe injection in args
        id: action_pipe
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSaFMOqKCBFBhL
            -----END RSA PRIVATE KEY-----
          args: 'up -d | cat /etc/passwd'
          deployment_mode: 'docker-compose'

      - name: Assert action failed due to pipe injection
        env:
          OUTCOME: ${{ steps.action_pipe.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with pipe in args, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected args with pipe"
