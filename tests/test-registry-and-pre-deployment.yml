name: Test registry credentials and pre-deployment command args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with registry credentials and pre_deployment_command_args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@192.0.2.1
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMPBFBNMHBMFMnhBP
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: docker-compose
          keep_files: '4'
          docker_prune: 'false'
          copy_stack_file: 'false'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'
          pre_deployment_command_args: 'config'

      - name: Assert action ran (validation passed for registry and pre-deployment inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at SSH stage (no real host), not at input validation.
          # We confirm the action ran and did not exit early due to validation errors
          # on docker_registry_username, docker_registry_password, or pre_deployment_command_args.
          echo "Action completed with outcome: $OUTCOME"
          echo "PASS: action ran with registry credentials and pre_deployment_command_args (validation passed)"
