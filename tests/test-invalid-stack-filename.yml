name: Test invalid stack_file_name with path separator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with stack_file_name containing a path separator
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@192.0.2.1"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakekey\n-----END OPENSSH PRIVATE KEY-----"
          args: "up -d"
          stack_file_name: "subdir/docker-compose.yml"

      - name: Assert action failed with stack_file_name path error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail because stack_file_name must not contain '/'"
            exit 1
          fi
          echo "PASS: action correctly rejected stack_file_name with path separator"
