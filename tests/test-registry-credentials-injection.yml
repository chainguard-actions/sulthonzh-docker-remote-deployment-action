name: Test docker registry credentials with command injection in username
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with shell metacharacters in docker_registry_username
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakekey\n-----END OPENSSH PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          docker_registry_username: "user;malicious"
          docker_registry_password: "somepassword"
          docker_registry_uri: "https://registry.hub.docker.com"

      - name: Assert action failed due to command injection in docker_registry_username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with dangerous characters in docker_registry_username, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected command injection attempt in docker_registry_username"
