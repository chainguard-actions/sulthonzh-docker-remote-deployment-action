name: Test private registry and pre-deployment command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate temporary SSH key pair for test
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "TEST_SSH_PRIVATE_KEY=$(cat /tmp/test_key)" >> $GITHUB_ENV
          echo "TEST_SSH_PUBLIC_KEY=$(cat /tmp/test_key.pub)" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@192.0.2.1
          remote_docker_port: '22'
          ssh_public_key: ${{ env.TEST_SSH_PUBLIC_KEY }}
          ssh_private_key: ${{ env.TEST_SSH_PRIVATE_KEY }}
          args: up -d
          deployment_mode: docker-compose
          docker_registry_username: myregistryuser
          docker_registry_password: myregistrypassword
          docker_registry_uri: https://registry.hub.docker.com
          pre_deployment_command_args: config
      - name: Assert action ran (SSH failure expected, not input validation failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail due to SSH connection to a non-existent host.
          # What matters is that the inputs were accepted (no input validation error).
          # If outcome is 'success' or 'failure' (not 'skipped'), inputs were processed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action processed inputs (outcome=$OUTCOME, SSH failure expected)"
