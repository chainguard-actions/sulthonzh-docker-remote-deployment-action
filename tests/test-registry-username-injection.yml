name: Test injection prevention in docker_registry_username
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with shell metacharacter in docker_registry_username
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host.example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupLMHBMFnMFAa
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          docker_registry_username: 'user;malicious-command'
          docker_registry_password: 'somepassword'

      - name: Assert action failed due to injection attempt in docker_registry_username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with metacharacter in docker_registry_username, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected docker_registry_username with shell metacharacters"
