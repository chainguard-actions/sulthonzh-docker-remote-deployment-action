name: Test registry username injection blocked
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with shell metacharacters in docker_registry_username
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: "user'; rm -rf /"
          docker_registry_password: 'somepassword'

      - name: Assert action failed due to injection in docker_registry_username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when docker_registry_username contains shell metacharacters"
            exit 1
          fi
          echo "PASS: action correctly blocked injection in docker_registry_username"
