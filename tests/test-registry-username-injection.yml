name: Test docker_registry_username injection prevention
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with injected docker_registry_username
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          docker_registry_username: "user;rm -rf /"
          docker_registry_password: "somepassword"

      - name: Assert action failed due to injection in docker_registry_username
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with injected docker_registry_username, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected docker_registry_username with dangerous characters"
