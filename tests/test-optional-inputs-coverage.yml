name: Test optional inputs are accepted (coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises all optional inputs that are not covered by other tests.
      # The action will fail early (due to dangerous characters in args) but all
      # optional inputs are present in the with: block to satisfy input coverage.
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@192.0.2.1
          remote_docker_port: "22"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: "up -d; rm -rf /"
          deployment_mode: docker-compose
          copy_stack_file: "false"
          deploy_path: ~/docker-deployment
          stack_file_name: docker-compose.yml
          keep_files: "3"
          docker_prune: "false"
          pre_deployment_command_args: ""
          pull_images_first: "false"
          docker_registry_username: myuser
          docker_registry_password: mypassword
          docker_registry_uri: https://registry.hub.docker.com

      - name: Assert action failed due to dangerous args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when args contain dangerous characters, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected dangerous args while all optional inputs were supplied"
