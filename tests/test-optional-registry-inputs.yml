name: Test optional registry and prune inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises optional registry and maintenance inputs:
      # docker_registry_username, docker_registry_password, docker_registry_uri,
      # docker_prune, and pull_images_first.
      # The action will fail because it cannot SSH to the fake host,
      # but the inputs must be accepted without validation errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@192.0.2.1
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: "up -d"
          docker_registry_username: testuser
          docker_registry_password: testpassword
          docker_registry_uri: https://registry.hub.docker.com
          docker_prune: "false"
          pull_images_first: "false"

      - name: Assert action failed due to SSH connectivity (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to unreachable host"
            exit 1
          fi
          echo "PASS: action correctly failed (SSH connection refused as expected)"
