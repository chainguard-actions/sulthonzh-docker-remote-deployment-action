name: Test shell injection prevention in stack_file_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with shell injection in stack_file_name
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.168.1.1'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          stack_file_name: 'docker-compose.yml$(whoami)'
      - name: Assert action failed due to injection in stack_file_name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when stack_file_name contains shell metacharacters"
            exit 1
          fi
          echo "PASS: action correctly rejected stack_file_name with injection characters"
