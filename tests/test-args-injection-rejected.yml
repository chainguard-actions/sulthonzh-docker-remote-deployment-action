name: Test command injection in args is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: deploy@127.0.0.1
          ssh_public_key: dummy-public-key
          ssh_private_key: dummy-private-key
          args: "up -d; touch /github/workspace/injected-marker"
      - name: Assert action failed and injection did not execute
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for args containing ';'"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/injected-marker" ]; then
            echo "FAIL: injected command was executed"
            exit 1
          fi
          echo "PASS"
