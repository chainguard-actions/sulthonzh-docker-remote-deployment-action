name: Test invalid boolean input for docker_prune
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@example.com'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSFAMFAMFAMFAM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          docker_prune: 'yes'
      - name: Assert action failed with invalid boolean error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid docker_prune value 'yes', got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid boolean value 'yes' for docker_prune"
