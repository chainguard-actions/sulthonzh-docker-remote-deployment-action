name: Test shell injection prevention in remote_docker_host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with backtick injection in remote_docker_host
        id: action_backtick
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host`whoami`'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCTFHFBBHFBBHFBBHF
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed with backtick injection in host
        env:
          OUTCOME: ${{ steps.action_backtick.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with backtick injection in host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected backtick injection in remote_docker_host"

      - name: Run action with ampersand injection in remote_docker_host
        id: action_ampersand
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host&malicious'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCTFHFBBHFBBHFBBHF
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed with ampersand injection in host
        env:
          OUTCOME: ${{ steps.action_ampersand.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with ampersand injection in host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected ampersand injection in remote_docker_host"
