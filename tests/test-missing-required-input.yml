name: Test Missing Required Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing remote_docker_host (expect failure)
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: ''
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakeprivatekey
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed due to missing remote_docker_host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when remote_docker_host is empty"
            exit 1
          fi
          echo "PASS: action correctly failed with missing remote_docker_host"
