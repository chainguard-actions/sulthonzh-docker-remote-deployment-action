name: Test missing required input ssh_private_key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with missing ssh_private_key
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: ''
          args: 'up -d'
          deployment_mode: 'docker-compose'
      - name: Assert action failed due to missing ssh_private_key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ssh_private_key is empty, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input ssh_private_key is missing"
