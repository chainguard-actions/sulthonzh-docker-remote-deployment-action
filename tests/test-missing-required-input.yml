name: Test missing required input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # remote_docker_host is intentionally omitted (required input)
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCHFMFBMBnFBKMCOaP
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing remote_docker_host, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input remote_docker_host is missing"
