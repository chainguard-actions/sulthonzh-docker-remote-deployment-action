name: Test optional deployment inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises optional deployment-related inputs:
      # deployment_mode, stack_file_name, keep_files, copy_stack_file,
      # and pre_deployment_command_args.
      # The action will fail because it cannot SSH to the fake host,
      # but the inputs must be accepted without validation errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@192.0.2.1
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: "up -d"
          deployment_mode: docker-compose
          stack_file_name: docker-compose.yml
          keep_files: "3"
          copy_stack_file: "false"
          pre_deployment_command_args: "echo pre-deploy"

      - name: Assert action failed due to SSH connectivity (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to unreachable host"
            exit 1
          fi
          echo "PASS: action correctly failed (SSH connection refused as expected)"
