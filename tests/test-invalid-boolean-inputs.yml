name: Test invalid boolean input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid docker_prune value
        id: action_prune
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          docker_prune: "yes"

      - name: Assert action failed due to invalid docker_prune value
        env:
          OUTCOME: ${{ steps.action_prune.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with docker_prune=yes, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid docker_prune value"

      - name: Run action with invalid pull_images_first value
        id: action_pull
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          pull_images_first: "1"

      - name: Assert action failed due to invalid pull_images_first value
        env:
          OUTCOME: ${{ steps.action_pull.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with pull_images_first=1, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid pull_images_first value"
