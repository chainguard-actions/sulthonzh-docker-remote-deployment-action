name: Test private registry inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises the private registry inputs (docker_registry_username,
      # docker_registry_password, docker_registry_uri). The action will fail at
      # host validation because 'invalidhost' has no user@ prefix, which is
      # intentional — we verify the inputs are accepted and validation runs.
      - name: Run action with private registry inputs and invalid host
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'invalidhost'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupGMZmn3eFRNB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action failed due to invalid host format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid host format, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid host format when registry inputs are provided"
