name: Test private registry username and password inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a real SSH key pair for testing
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "public_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key.pub >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run action with private registry credentials (expect SSH failure, not validation failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@192.0.2.1"
          remote_docker_port: "22"
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: "up -d"
          deployment_mode: "docker-compose"
          docker_registry_username: "testuser"
          docker_registry_password: "testpassword"
          docker_registry_uri: "https://registry.hub.docker.com"
      - name: Assert action failed at SSH stage (not validation stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because 192.0.2.1 is a TEST-NET address (RFC 5737)
          # that is guaranteed to be unreachable. The failure should happen at SSH
          # connection stage, meaning all input validation (including registry credentials)
          # passed successfully.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at SSH stage), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed at SSH stage as expected (registry credential inputs accepted)"
