name: Test non-numeric remote_docker_port value
on:
  workflow_dispatch:

jobs:
  test-non-numeric-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric port (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: 'not-a-number'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed due to non-numeric port
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when remote_docker_port is not a number, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when remote_docker_port was not a number"
