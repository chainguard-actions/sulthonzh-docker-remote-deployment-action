name: Test pre-deployment command args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pre_deployment_command_args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakekeydata
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config'

      - name: Assert action failed at SSH connection (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable (192.0.2.1 is TEST-NET),
          # not because of invalid pre_deployment_command_args. The input was accepted.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH unreachable), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted pre_deployment_command_args and failed at SSH connection as expected"
