name: Test pre-deployment command args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pre_deployment_command_args set
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          remote_docker_port: "22"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          pre_deployment_command_args: "config"

      - name: Assert action ran with pre_deployment_command_args provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because there is no real SSH host,
          # but it must not be skipped — it must have been invoked with the pre_deployment_command_args input.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with pre_deployment_command_args input"
