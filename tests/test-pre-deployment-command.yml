name: Test pre-deployment command args (fail at SSH)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pre_deployment_command_args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCBBFMhFqJFBqBqS
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          stack_file_name: 'docker-compose.yml'
          keep_files: '4'
          docker_prune: 'false'
          pull_images_first: 'false'
          pre_deployment_command_args: 'config'

      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable,
          # but it should have passed input validation including pre_deployment_command_args.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at SSH stage, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at SSH/connection stage (pre_deployment_command_args input accepted)"
