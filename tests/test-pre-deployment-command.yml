name: Test Pre-Deployment Command Args Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake SSH keys
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N ""
          echo "SSH_PRIVATE_KEY=$(cat /tmp/test_key)" >> $GITHUB_ENV
          echo "SSH_PUBLIC_KEY=$(cat /tmp/test_key.pub)" >> $GITHUB_ENV
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: testuser@192.0.2.1
          ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
          ssh_private_key: ${{ env.SSH_PRIVATE_KEY }}
          args: up -d
          deployment_mode: docker-compose
          pre_deployment_command_args: config
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at SSH connection (no real host),
          # but it must not fail due to input validation of pre_deployment_command_args.
          # Any outcome other than 'skipped' means the inputs were accepted and processed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: pre_deployment_command_args input was accepted"
