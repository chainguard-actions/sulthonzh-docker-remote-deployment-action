name: Test pre-deployment command args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@nonexistent.example.invalid
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC3test test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: up -d
          deployment_mode: docker-compose
          pre_deployment_command_args: config
      - name: Assert action ran with pre-deployment command args (SSH failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable,
          # NOT because of input validation. Either outcome (success/failure)
          # is acceptable — but it must not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — pre_deployment_command_args input accepted, SSH failed as expected"
