name: Test non-numeric port is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action validates that remote_docker_port is numeric.
      # Providing a non-numeric port should cause the action to exit 1
      # with "Error: remote_docker_port must be a number".
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@192.0.2.1
          remote_docker_port: "not-a-number"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: "up -d"

      - name: Assert action failed due to invalid port
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when port is non-numeric, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected non-numeric port"
