name: Test dangerous characters in args validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with dangerous characters in args (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          ssh_public_key: fake-public-key
          ssh_private_key: fake-private-key
          args: "up -d; rm -rf /"
          deployment_mode: docker-compose

      - name: Assert action failed due to dangerous characters in args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with dangerous characters in args, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected dangerous characters in args"
