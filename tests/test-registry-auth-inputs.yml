name: Test docker registry authentication inputs
on:
  workflow_dispatch:
jobs:
  test-registry-auth-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@remotehost"
          remote_docker_port: "22"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          docker_registry_username: "myregistryuser"
          docker_registry_password: "myregistrypassword"
          docker_registry_uri: "https://registry.hub.docker.com"
      - name: Assert action ran with registry inputs (fails at SSH, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at SSH/docker context stage (unreachable host),
          # not at input validation. Either failure or success is acceptable here
          # since we are only verifying the registry inputs are accepted by the action.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted registry credential inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
