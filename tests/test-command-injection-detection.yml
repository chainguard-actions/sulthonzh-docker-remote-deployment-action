name: Test command injection detection in args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test 1: semicolon in args should be rejected (command separator)
      - id: semicolon_args
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d; rm -rf /'

      - name: Assert semicolon in args was rejected
        env:
          OUTCOME: ${{ steps.semicolon_args.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon in args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected semicolon in args"

      # Test 2: backtick command substitution in args should be rejected
      - id: backtick_args
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d `whoami`'

      - name: Assert backtick in args was rejected
        env:
          OUTCOME: ${{ steps.backtick_args.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with backtick in args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected backtick in args"

      # Test 3: pipe character in args should be rejected
      - id: pipe_args
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d | cat /etc/passwd'

      - name: Assert pipe in args was rejected
        env:
          OUTCOME: ${{ steps.pipe_args.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with pipe in args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected pipe in args"
