name: Test valid inputs pass validation (SSH fails as expected)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid inputs (will fail at SSH stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'deploy@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          keep_files: '4'
          docker_prune: 'false'
          copy_stack_file: 'false'

      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable,
          # NOT because of input validation errors.
          # Either failure or success is acceptable here — what matters is
          # that the action did not exit early due to input validation.
          # In practice, it will fail because 192.0.2.1 is a TEST-NET address
          # (RFC 5737) that is guaranteed to be unreachable.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at SSH/docker stage as expected (valid inputs passed validation)"
          else
            echo "PASS: action completed (unexpected but not a validation failure)"
          fi
