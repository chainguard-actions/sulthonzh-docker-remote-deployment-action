name: Test path traversal in deploy_path is rejected
on:
  workflow_dispatch:
jobs:
  test-path-traversal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The entrypoint validates deploy_path for path traversal attempts (.. sequences).
      # Passing a deploy_path with '..' should cause the action to exit with an error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@localhost"
          ssh_public_key: "fake-pub-key"
          ssh_private_key: "fake-priv-key"
          args: "up -d"
          deploy_path: "/home/user/../../../etc"

      - name: Assert action failed due to path traversal in deploy_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when deploy_path contains path traversal"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in deploy_path"
