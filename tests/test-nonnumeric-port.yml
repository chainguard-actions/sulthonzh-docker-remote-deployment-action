name: Test non-numeric remote_docker_port rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric port
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@192.0.2.1"
          remote_docker_port: "notaport"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfakekey\n-----END OPENSSH PRIVATE KEY-----"
          args: "up -d"

      - name: Assert action failed with non-numeric port error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to non-numeric port"
            exit 1
          fi
          echo "PASS: action correctly rejected non-numeric port"
