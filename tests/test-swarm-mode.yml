name: Test docker-swarm deployment mode validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in docker-swarm mode with unreachable host
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCBBFMhFqJFBqBqS
            -----END RSA PRIVATE KEY-----
          args: 'deploy my-stack'
          deployment_mode: 'docker-swarm'
          stack_file_name: 'docker-compose.yml'

      - name: Assert action failed at connection stage (not at mode validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable,
          # but it should have accepted 'docker-swarm' as a valid deployment_mode.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at SSH stage for swarm mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted docker-swarm mode and failed at connection stage as expected"
