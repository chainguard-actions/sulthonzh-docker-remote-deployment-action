name: Test invalid prune_volumes and keep_files values
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid prune_volumes value
        id: action_prune
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          docker_prune: 'true'
          prune_volumes: 'yes'

      - name: Assert action failed due to invalid prune_volumes
        env:
          OUTCOME: ${{ steps.action_prune.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid prune_volumes='yes', but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid prune_volumes value"

      - name: Run action with zero keep_files (invalid)
        id: action_keep
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          keep_files: '0'

      - name: Assert action failed due to zero keep_files
        env:
          OUTCOME: ${{ steps.action_keep.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with keep_files=0, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected keep_files=0"

      - name: Run action with non-integer keep_files (invalid)
        id: action_keep2
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          keep_files: 'abc'

      - name: Assert action failed due to non-integer keep_files
        env:
          OUTCOME: ${{ steps.action_keep2.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with keep_files=abc, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected non-integer keep_files"
