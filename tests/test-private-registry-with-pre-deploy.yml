name: Test private registry and pre-deployment command args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry credentials and pre-deployment args (expect failure due to SSH)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          ssh_public_key: fake-public-key
          ssh_private_key: fake-private-key
          args: up -d
          deployment_mode: docker-compose
          docker_registry_username: myuser
          docker_registry_password: mysecretpassword
          docker_registry_uri: https://registry.hub.docker.com
          pre_deployment_command_args: config

      - name: Assert action failed (SSH connection to fake host expected to fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no real SSH host), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when connecting to a fake remote host"
