name: Test private registry credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with registry credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.168.1.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'
      - name: Assert action ran with registry credentials inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because there is no real SSH host reachable,
          # but it must not be skipped — it must have been attempted (failure or success).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped; expected it to be attempted with registry credentials"
            exit 1
          fi
          echo "PASS: action was attempted with docker_registry_username and docker_registry_password inputs"
