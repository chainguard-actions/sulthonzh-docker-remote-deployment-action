name: Test registry credentials inputs are accepted by validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with registry credentials (fails at SSH stage, not validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host.example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupLMHBMFnMFAa
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action failed at SSH/connection stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because it cannot connect to the fake SSH host,
          # NOT because of input validation errors on registry credentials.
          # Either failure outcome is acceptable here — what matters is the inputs
          # were accepted by the validation layer (no early exit on bad input format).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at SSH stage), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted registry credentials through validation and failed at connection stage as expected"
