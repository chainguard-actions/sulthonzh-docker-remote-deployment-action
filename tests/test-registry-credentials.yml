name: Test registry credentials inputs
on:
  workflow_dispatch:

jobs:
  test-registry-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with registry credentials (expect failure at SSH stage, not input validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action ran (failed at SSH/docker stage, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (SSH connection to example.com will fail),
          # but it must NOT succeed (we have no real remote host).
          # The important thing is that the registry credential inputs were accepted
          # (not rejected by input validation). Any failure is expected here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (SSH connection to test host fails), registry credential inputs were accepted by validation"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
