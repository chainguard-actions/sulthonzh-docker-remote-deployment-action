name: Test registry credentials inputs coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with registry credentials and injection attempt in username
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@host.example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          docker_registry_username: "myuser; rm -rf /"
          docker_registry_password: "mypassword"
          docker_registry_uri: "https://registry.hub.docker.com"

      - name: Assert action failed due to invalid registry username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with command injection in registry username, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected command injection in registry username"
