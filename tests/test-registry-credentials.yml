name: Test registry credentials inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSMBDMBMFhSMBD\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: docker-compose
          docker_registry_username: testuser
          docker_registry_password: testpassword
          docker_registry_uri: https://registry.hub.docker.com
      - name: Assert action attempted deployment (registry inputs accepted, SSH failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the SSH host is not reachable,
          # but the registry credential inputs must be accepted without validation errors.
          # A failure here means the action ran (inputs were accepted) and failed at SSH stage.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at SSH stage (not at input validation)"
            exit 1
          fi
          echo "PASS: registry credential inputs were accepted; action failed at SSH stage as expected"
