name: Test private registry credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with private registry credentials
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFBHFTMBMFBGMFBGM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because it cannot SSH into 192.0.2.1
          # (a TEST-NET address), but it must NOT be skipped — it must have been
          # invoked with the registry credential inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped; registry credential inputs may have been rejected before invocation"
            exit 1
          fi
          echo "PASS: action was invoked with docker_registry_username and docker_registry_password inputs"
