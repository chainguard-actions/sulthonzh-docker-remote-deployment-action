name: Test registry credentials inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: "up -d; rm -rf /"
          docker_registry_username: "myuser"
          docker_registry_password: "mypassword"
          docker_registry_uri: "https://registry.hub.docker.com"
      - name: Assert action failed due to dangerous characters in args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with dangerous args, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected dangerous characters in args (registry credentials inputs covered)"
