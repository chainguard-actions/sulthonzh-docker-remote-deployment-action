name: Test docker registry credentials input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Missing user@ prefix — should fail format validation before SSH
          remote_docker_host: "notavalidhost"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupSMoYMSBNMnG\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          docker_registry_username: "myregistryuser"
          docker_registry_password: "myregistrypassword"
          docker_registry_uri: "https://registry.hub.docker.com"
      - name: Assert action failed due to invalid host format (registry credentials covered)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid host format, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid host format; registry credential inputs were covered"
