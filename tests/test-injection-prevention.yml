name: Test command injection prevention
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with injection attempt in host
        id: action-host-injection
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host; rm -rf /'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMVQFMBMHBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
      - name: Assert host injection was rejected
        env:
          OUTCOME: ${{ steps.action-host-injection.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to reject host with injection characters"
            exit 1
          fi
          echo "PASS: action correctly rejected host with injection characters"
      - name: Run action with injection attempt in stack_file_name
        id: action-stack-injection
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMVQFMBMHBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          stack_file_name: 'docker-compose.yml; cat /etc/passwd'
      - name: Assert stack_file_name injection was rejected
        env:
          OUTCOME: ${{ steps.action-stack-injection.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to reject stack_file_name with injection characters"
            exit 1
          fi
          echo "PASS: action correctly rejected stack_file_name with injection characters"
