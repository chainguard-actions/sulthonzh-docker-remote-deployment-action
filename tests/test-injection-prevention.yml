name: Test command injection prevention in args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with injection attempt in args
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhHKMFBMBBBBBBB\n-----END RSA PRIVATE KEY-----"
          args: "up -d; rm -rf /"

      - name: Assert action failed due to injection attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with injection attempt in args, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected args containing dangerous characters"
