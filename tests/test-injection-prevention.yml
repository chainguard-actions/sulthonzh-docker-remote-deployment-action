name: Test command injection prevention in args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "public_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key.pub >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with semicolon injection in args
        id: action_semicolon
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@somehost'
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: 'up -d; rm -rf /'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with semicolon injection
        run: |
          echo "outcome: ${{ steps.action_semicolon.outcome }}"
          if [ "${{ steps.action_semicolon.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon injection in args, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly rejected semicolon injection in args"

      - name: Run action with pipe injection in args
        id: action_pipe
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@somehost'
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: 'up -d | cat /etc/passwd'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with pipe injection
        run: |
          echo "outcome: ${{ steps.action_pipe.outcome }}"
          if [ "${{ steps.action_pipe.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with pipe injection in args, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly rejected pipe injection in args"
