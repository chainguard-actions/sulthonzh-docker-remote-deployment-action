name: Test command injection prevention in args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with semicolon injection in remote_docker_host
        id: action_semicolon
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host;malicious'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhFSMoSVmFJHBbK
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with semicolon injection in host
        env:
          OUTCOME: ${{ steps.action_semicolon.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon in host, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected semicolon injection in host"

      - name: Run action with pipe injection in remote_docker_host
        id: action_pipe
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host|cat'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhFSMoSVmFJHBbK
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with pipe injection in host
        env:
          OUTCOME: ${{ steps.action_pipe.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with pipe in host, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected pipe injection in host"

      - name: Run action with path traversal in deploy_path
        id: action_traversal
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhFSMoSVmFJHBbK
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deploy_path: '~/../../etc'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with path traversal in deploy_path
        env:
          OUTCOME: ${{ steps.action_traversal.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in deploy_path, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in deploy_path"
