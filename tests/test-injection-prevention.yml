name: Test command injection prevention in args
on:
  workflow_dispatch:

jobs:
  test-injection-prevention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with shell injection characters in args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhCBMOoTf7EQKQR
            -----END RSA PRIVATE KEY-----
          args: 'up -d; rm -rf /'

      - name: Assert action failed due to injection attempt in args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with injection characters in args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected args with shell injection characters"
