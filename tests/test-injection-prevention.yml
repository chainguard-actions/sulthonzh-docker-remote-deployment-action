name: Test command injection prevention
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with semicolon injection in host
        id: action_semicolon
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host;malicious'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed due to semicolon injection
        env:
          OUTCOME: ${{ steps.action_semicolon.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon in host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected semicolon injection in host"

      - name: Run action with backtick injection in args
        id: action_backtick
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d `whoami`'

      - name: Assert action failed due to backtick injection in args
        env:
          OUTCOME: ${{ steps.action_backtick.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with backtick injection in args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected backtick injection in args"
