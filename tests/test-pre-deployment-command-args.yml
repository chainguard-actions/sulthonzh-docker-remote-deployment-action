name: Test pre_deployment_command_args input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pre_deployment_command_args (will fail at SSH stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'deploy@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          keep_files: '4'
          docker_prune: 'false'
          copy_stack_file: 'false'
          pre_deployment_command_args: 'config'

      - name: Assert action failed at SSH stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable,
          # NOT because of input validation errors on pre_deployment_command_args.
          # 'config' is a valid docker-compose pre-deployment command (validates the compose file).
          # 192.0.2.1 is a TEST-NET address (RFC 5737) guaranteed to be unreachable.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at SSH/docker stage as expected (pre_deployment_command_args passed validation)"
          else
            echo "PASS: action completed (unexpected but not a validation failure)"
          fi
