name: Test pre_deployment_command_args input reaches SSH stage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with pre_deployment_command_args (will fail at SSH, not validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@192.0.2.1"
          remote_docker_port: "22"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          pre_deployment_command_args: "config"
          docker_prune: "false"
          prune_volumes: "false"
          copy_stack_file: "false"
          pull_images_first: "false"
          keep_files: "4"
      - name: Assert action failed at SSH stage (not at input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail (SSH connection to 192.0.2.1 will fail),
          # but it must NOT fail with an input validation error.
          # We verify it failed (SSH failure is expected) rather than succeeded.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH connection to unreachable host)"
            exit 1
          fi
          echo "PASS: action passed input validation (including pre_deployment_command_args) and failed at SSH stage as expected"
