name: Test pre_deployment_command_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pre_deployment_command_args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMPBFBMHMBEMhMBHM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config'

      - name: Assert action attempted deployment with pre-deployment args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the SSH key is invalid/fake,
          # but the pre_deployment_command_args input must be accepted (not rejected by validation).
          # A failure here means the action ran with the pre-deployment args provided.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at SSH connection (fake credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted pre_deployment_command_args input and failed at SSH connection as expected"
