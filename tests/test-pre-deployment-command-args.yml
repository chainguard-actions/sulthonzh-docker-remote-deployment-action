name: Test pre_deployment_command_args input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@192.0.2.1"
          remote_docker_port: "22"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@example.com"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          pre_deployment_command_args: "config"
      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because SSH connection to 192.0.2.1 (TEST-NET, unreachable)
          # will fail — but it must NOT fail during input validation.
          # Either outcome (success or failure) is acceptable here, but failure is expected
          # since there is no real remote host. The key is that validation passed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at SSH/connection stage as expected (validation passed with pre_deployment_command_args)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
