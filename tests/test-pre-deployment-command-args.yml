name: Test pre_deployment_command_args input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pre_deployment_command_args set
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'deploy@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config'

      - name: Assert action failed at SSH (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because SSH cannot connect to 192.0.2.1 (TEST-NET),
          # NOT because of invalid pre_deployment_command_args. The input "config" is
          # a valid docker-compose subcommand and should pass input validation.
          # Failure is expected due to no real SSH host.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH unreachable), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (SSH unreachable, pre_deployment_command_args accepted)"
