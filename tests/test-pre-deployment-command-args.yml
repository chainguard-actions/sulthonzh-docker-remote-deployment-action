name: Test pre_deployment_command_args input validation
on:
  workflow_dispatch:

jobs:
  test-pre-deployment-command-args:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with injection attempt in pre_deployment_command_args (expect failure)
        id: action-injection
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config; rm -rf /'

      - name: Assert action failed due to dangerous pre_deployment_command_args
        env:
          OUTCOME: ${{ steps.action-injection.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pre_deployment_command_args contains shell metacharacters (;), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected pre_deployment_command_args with dangerous shell metacharacters"

      - name: Run action with valid pre_deployment_command_args (expect failure at SSH stage only)
        id: action-valid
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config'

      - name: Assert action ran with valid pre_deployment_command_args (failed at SSH, not validation)
        env:
          OUTCOME: ${{ steps.action-valid.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at SSH connection stage (no real remote host),
          # but the pre_deployment_command_args value 'config' should pass validation.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (SSH connection to test host fails), pre_deployment_command_args was accepted by validation"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
