name: Test missing required remote_docker_host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without remote_docker_host
        id: action
        uses: .
        continue-on-error: true
        env:
          # Unset the INPUT_REMOTE_DOCKER_HOST to simulate missing required input
          INPUT_REMOTE_DOCKER_HOST: ''
        with:
          # remote_docker_host is intentionally omitted — GitHub Actions will
          # still pass an empty string for required inputs when not provided via with:
          # We simulate this by providing an empty value
          remote_docker_host: ''
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCTBMFBsRMNMNMNMNM
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed due to missing host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty remote_docker_host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected empty remote_docker_host"
