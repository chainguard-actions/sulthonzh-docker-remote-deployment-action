name: Test pre_deployment_command_args with shell injection is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a throwaway SSH key pair
        id: keys
        run: |
          tmp="$(mktemp -d)"
          ssh-keygen -q -t ed25519 -N "" -f "$tmp/id" -C act-test
          {
            echo "private<<EOF_PRIV"
            cat "$tmp/id"
            echo "EOF_PRIV"
            echo "public=$(cat "$tmp/id.pub")"
          } >> "$GITHUB_OUTPUT"
          rm -rf "$tmp"
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: deploy@127.0.0.1
          remote_docker_port: "1"
          ssh_public_key: ${{ steps.keys.outputs.public }}
          ssh_private_key: ${{ steps.keys.outputs.private }}
          args: up -d
          deployment_mode: docker-compose
          pre_deployment_command_args: "config; rm -rf /"
      - name: Assert action failed on injected pre-deployment args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for injected pre_deployment_command_args"
            exit 1
          fi
          echo "PASS"
