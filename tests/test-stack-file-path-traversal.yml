name: Test stack_file_name path traversal blocked
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with path separator in stack_file_name
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@remotehost'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMPBFBMHFMFHMF
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          stack_file_name: '../etc/passwd'
      - name: Assert action failed due to path traversal in stack_file_name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when stack_file_name contains path traversal"
            exit 1
          fi
          echo "PASS: action correctly blocked path traversal in stack_file_name"
