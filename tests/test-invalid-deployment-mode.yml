name: Test invalid deployment_mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: testuser@192.0.2.1
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC0fake test@example"
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          args: up -d
          deployment_mode: invalid-mode
      - name: Assert action failed with deployment_mode validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because deployment_mode must be 'docker-compose' or 'docker-swarm'
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid deployment_mode"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected invalid deployment_mode"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
