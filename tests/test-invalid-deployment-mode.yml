name: Test invalid deployment mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid deployment mode
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "kubernetes"
      - name: Assert action failed with invalid deployment mode
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid deployment mode"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid deployment mode"
