name: Test invalid deployment_mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid deployment_mode
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@somehost'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCTBMFBsRMBSMkMkMk
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'invalid-mode'

      - name: Assert action failed with invalid deployment_mode
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid deployment_mode"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid deployment_mode"
