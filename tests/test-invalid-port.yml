name: Test invalid port number
on:
  workflow_dispatch:
jobs:
  test-invalid-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The entrypoint validates that remote_docker_port is numeric.
      # Passing a non-numeric value should cause the action to exit with an error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@localhost"
          remote_docker_port: "not-a-number"
          ssh_public_key: "fake-pub-key"
          ssh_private_key: "fake-priv-key"
          args: "up -d"

      - name: Assert action failed due to invalid port
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when remote_docker_port is not numeric"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid port number"
