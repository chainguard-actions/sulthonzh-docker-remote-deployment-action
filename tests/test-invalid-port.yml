name: Test invalid remote_docker_port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with port out of range (99999)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          remote_docker_port: "99999"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"

      - name: Assert action failed due to invalid port
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with port out of range, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly rejected out-of-range port"
