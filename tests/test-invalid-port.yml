name: Test invalid port validation
on:
  workflow_dispatch:
jobs:
  test-invalid-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid port (non-numeric)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@nonexistent.example.com
          remote_docker_port: 'not-a-port'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: docker-compose

      - name: Assert action failed due to invalid port
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid port, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid port"
