name: Test invalid remote_docker_port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with out-of-range port
        id: action_high_port
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          remote_docker_port: "99999"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"

      - name: Assert action failed due to invalid port (too high)
        env:
          OUTCOME: ${{ steps.action_high_port.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with port 99999, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected out-of-range port"

      - name: Run action with port zero
        id: action_zero_port
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          remote_docker_port: "0"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"

      - name: Assert action failed due to invalid port (zero)
        env:
          OUTCOME: ${{ steps.action_zero_port.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with port 0, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected port 0"
