name: Test invalid remote_docker_port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric port
        id: action_non_numeric
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: 'notaport'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhFSMoSVmFJHBbK
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with non-numeric port
        env:
          OUTCOME: ${{ steps.action_non_numeric.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-numeric port, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected non-numeric port"

      - name: Run action with out-of-range port (0)
        id: action_zero_port
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '0'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhFSMoSVmFJHBbK
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with port 0
        env:
          OUTCOME: ${{ steps.action_zero_port.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with port=0, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected port 0"

      - name: Run action with out-of-range port (99999)
        id: action_large_port
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '99999'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhFSMoSVmFJHBbK
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with port 99999
        env:
          OUTCOME: ${{ steps.action_large_port.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with port=99999, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected port 99999"
