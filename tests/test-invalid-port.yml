name: Test invalid remote_docker_port
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid port (0 is out of range)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '0'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSaFMOqKCBFBhL
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed due to invalid port
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid port 0, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid port"

      - name: Run action with port too large (65536)
        id: action2
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          remote_docker_port: '65536'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSaFMOqKCBFBhL
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed due to port too large
        env:
          OUTCOME: ${{ steps.action2.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with port 65536, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with port out of range"
