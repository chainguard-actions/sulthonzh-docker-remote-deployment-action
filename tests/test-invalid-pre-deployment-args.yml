name: Test invalid pre_deployment_command_args (injection prevention)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@example.com
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMFhSMBDMBMFhSMBD\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: docker-compose
          pre_deployment_command_args: "config; rm -rf /"
      - name: Assert action rejected dangerous pre_deployment_command_args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to dangerous pre_deployment_command_args"
            exit 1
          fi
          echo "PASS: action correctly rejected dangerous pre_deployment_command_args"
