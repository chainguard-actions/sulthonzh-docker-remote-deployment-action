name: Test injection prevention in pre_deployment_command_args
on:
  workflow_dispatch:
jobs:
  test-pre-deployment-args-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with shell metacharacter in pre_deployment_command_args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@remotehost"
          remote_docker_port: "22"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          pre_deployment_command_args: "config; malicious-command"
      - name: Assert action failed due to injection in pre_deployment_command_args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pre_deployment_command_args contains shell metacharacters, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected pre_deployment_command_args with shell metacharacters"
