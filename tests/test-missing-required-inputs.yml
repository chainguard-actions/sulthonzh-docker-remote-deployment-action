name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test-missing-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires remote_docker_host, ssh_public_key, ssh_private_key, and args.
      # When remote_docker_host is missing the entrypoint should exit with an error message.
      # We use continue-on-error so we can assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: ""
          ssh_public_key: "fake-pub-key"
          ssh_private_key: "fake-priv-key"
          args: "up -d"

      - name: Assert action failed due to missing remote_docker_host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when remote_docker_host is empty"
            exit 1
          fi
          echo "PASS: action correctly failed with missing remote_docker_host"
