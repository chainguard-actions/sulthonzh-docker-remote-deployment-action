name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without ssh_public_key
        id: action-no-pubkey
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMVQFMBMHBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
      - name: Assert action failed without ssh_public_key
        env:
          OUTCOME: ${{ steps.action-no-pubkey.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without ssh_public_key"
            exit 1
          fi
          echo "PASS: action correctly failed without ssh_public_key"
      - name: Run action without ssh_private_key
        id: action-no-privkey
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          args: 'up -d'
      - name: Assert action failed without ssh_private_key
        env:
          OUTCOME: ${{ steps.action-no-privkey.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without ssh_private_key"
            exit 1
          fi
          echo "PASS: action correctly failed without ssh_private_key"
