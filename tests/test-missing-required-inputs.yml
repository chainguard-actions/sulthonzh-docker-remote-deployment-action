name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing ssh_public_key
        id: action_no_pubkey
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: ''
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFGBMLRFMEMBFBBME
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert action failed with missing ssh_public_key
        env:
          OUTCOME: ${{ steps.action_no_pubkey.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty ssh_public_key, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected empty ssh_public_key"

      - name: Run action with missing ssh_private_key
        id: action_no_privkey
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: ''
          args: 'up -d'

      - name: Assert action failed with missing ssh_private_key
        env:
          OUTCOME: ${{ steps.action_no_privkey.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty ssh_private_key, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected empty ssh_private_key"

      - name: Run action with missing args
        id: action_no_args
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFGBMLRFMEMBFBBME
            -----END RSA PRIVATE KEY-----
          args: ''

      - name: Assert action failed with missing args
        env:
          OUTCOME: ${{ steps.action_no_args.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected empty args"
