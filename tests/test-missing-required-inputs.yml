name: Test missing required inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: missing remote_docker_host should fail
      # Note: GitHub Actions requires all 'required: true' inputs to be provided,
      # so we test with an empty string to simulate missing input behavior
      - id: missing_host
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: ''
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert missing remote_docker_host was rejected
        env:
          OUTCOME: ${{ steps.missing_host.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty remote_docker_host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected empty remote_docker_host"

      # Test: empty args should fail validation
      - id: empty_args
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: ''

      - name: Assert empty args was rejected
        env:
          OUTCOME: ${{ steps.empty_args.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty args, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected empty args"
