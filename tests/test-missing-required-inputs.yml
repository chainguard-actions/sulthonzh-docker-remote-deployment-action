name: Test missing required inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GitHub Actions requires all 'required: true' inputs to be provided,
      # so we test with an invalid host format to trigger early validation failure.
      # The action validates remote_docker_host format before attempting SSH.
      - name: Run action with empty-like host (only @)
        id: action_bad_host
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: '@'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupGMZmn3eFRNB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with malformed host
        env:
          OUTCOME: ${{ steps.action_bad_host.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with malformed host '@', but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with malformed host"

      - name: Run action with host missing user part
        id: action_no_user
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'hostname-only'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMCTupGMZmn3eFRNB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'

      - name: Assert action failed with host missing user part
        env:
          OUTCOME: ${{ steps.action_no_user.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with host missing user part, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with host missing user part"
