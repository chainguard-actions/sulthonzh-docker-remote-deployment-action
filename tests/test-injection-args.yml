name: Test args with injection characters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with injection characters in args (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@localhost
          ssh_public_key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCHFMFBMBnNaEMBBBB
            -----END RSA PRIVATE KEY-----
          args: "up -d; rm -rf /"
          deployment_mode: docker-compose
      - name: Assert action failed due to injection characters in args
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when args contain shell injection characters"
            exit 1
          fi
          echo "PASS: action correctly rejected args with dangerous characters"
