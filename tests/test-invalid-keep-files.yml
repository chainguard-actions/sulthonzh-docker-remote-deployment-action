name: Test invalid keep_files value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with keep_files set to zero
        id: action_zero
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFGBMLRFMEMBFBBME
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          keep_files: '0'

      - name: Assert action failed with keep_files=0
        env:
          OUTCOME: ${{ steps.action_zero.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with keep_files=0, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected keep_files=0"

      - name: Run action with keep_files set to non-integer
        id: action_str
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFGBMLRFMEMBFBBME
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          keep_files: 'abc'

      - name: Assert action failed with keep_files=abc
        env:
          OUTCOME: ${{ steps.action_str.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with keep_files=abc, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected non-integer keep_files"
