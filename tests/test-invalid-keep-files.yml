name: Test invalid keep_files value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-numeric keep_files
        id: action-non-numeric
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMVQFMBMHBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          keep_files: 'abc'
      - name: Assert action failed with non-numeric keep_files
        env:
          OUTCOME: ${{ steps.action-non-numeric.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-numeric keep_files"
            exit 1
          fi
          echo "PASS: action correctly rejected non-numeric keep_files"
      - name: Run action with zero keep_files
        id: action-zero
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMVQFMBMHBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          keep_files: '0'
      - name: Assert action failed with zero keep_files
        env:
          OUTCOME: ${{ steps.action-zero.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with zero keep_files"
            exit 1
          fi
          echo "PASS: action correctly rejected zero keep_files"
