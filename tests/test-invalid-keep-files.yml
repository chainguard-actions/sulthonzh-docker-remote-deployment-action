name: Test invalid keep_files value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-numeric keep_files
        id: action
        uses: .
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCGFMnFMBMCKAMbMbQ
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          keep_files: 'abc'
        continue-on-error: true
      - name: Assert action failed with invalid keep_files
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when keep_files is not a positive integer"
            exit 1
          fi
          echo "PASS: action correctly rejected non-numeric keep_files value"
