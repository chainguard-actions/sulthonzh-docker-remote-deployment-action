name: Test Invalid Keep Files Value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric keep_files (expect failure)
        id: action
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example.com'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fakeprivatekey
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          keep_files: 'notanumber'

      - name: Assert action failed due to invalid keep_files value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when keep_files is not a positive integer"
            exit 1
          fi
          echo "PASS: action correctly failed with non-numeric keep_files"
