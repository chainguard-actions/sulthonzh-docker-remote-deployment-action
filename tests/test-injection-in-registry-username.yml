name: Test command injection prevention in docker_registry_username
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@example"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          docker_registry_username: "user; rm -rf /"
          docker_registry_password: "somepassword"
      - name: Assert action failed due to injection in docker_registry_username
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with injection characters in docker_registry_username, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected injection attempt in docker_registry_username"
