name: Test invalid stack_file_name with path traversal
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with path traversal in stack_file_name
        id: action_traversal
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          stack_file_name: "../etc/passwd"

      - name: Assert action failed due to path traversal in stack_file_name
        env:
          OUTCOME: ${{ steps.action_traversal.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in stack_file_name, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in stack_file_name"

      - name: Run action with slash in stack_file_name
        id: action_slash
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          stack_file_name: "subdir/docker-compose.yml"

      - name: Assert action failed due to slash in stack_file_name
        env:
          OUTCOME: ${{ steps.action_slash.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with slash in stack_file_name, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected slash in stack_file_name"
