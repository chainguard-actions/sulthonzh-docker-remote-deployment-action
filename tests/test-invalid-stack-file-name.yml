name: Test invalid stack file name with path separator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with stack_file_name containing a slash
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          stack_file_name: "subdir/docker-compose.yml"
      - name: Assert action failed with path in stack_file_name
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when stack_file_name contains a path separator"
            exit 1
          fi
          echo "PASS: action correctly rejected stack_file_name with path separator"
