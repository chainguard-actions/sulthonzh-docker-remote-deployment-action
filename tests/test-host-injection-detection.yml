name: Test command injection detection in remote_docker_host
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: semicolon in remote_docker_host should be rejected
      - id: semicolon_host
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@host;evil'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'

      - name: Assert semicolon in host was rejected
        env:
          OUTCOME: ${{ steps.semicolon_host.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with semicolon in host, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected semicolon in host"

      # Test: path traversal in deploy_path should be rejected
      - id: path_traversal
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCMBBBBBBBBBBBBBBB
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deploy_path: '~/docker/../../../etc'

      - name: Assert path traversal in deploy_path was rejected
        env:
          OUTCOME: ${{ steps.path_traversal.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with path traversal in deploy_path, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected path traversal in deploy_path"
