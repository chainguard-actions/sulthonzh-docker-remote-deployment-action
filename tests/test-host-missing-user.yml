name: Test host format missing user prefix validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with host missing user@ prefix
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'example.com'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCFGFGFGFGFGFGFG
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
      - name: Assert action failed due to missing user@ prefix in host
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with host missing user@ prefix, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with host missing user@ prefix"
