name: Test docker registry credentials with invalid host
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with registry credentials and invalid host format
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'not-a-valid-host-format'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFPPMNhFMhFoMwhBFMhF
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'myregistrypassword'

      - name: Assert action failed due to invalid host format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid host format, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid host format (registry credentials inputs covered)"
