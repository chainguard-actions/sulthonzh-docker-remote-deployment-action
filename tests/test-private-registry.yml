name: Test private registry credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with private registry credentials (expect failure at SSH stage)
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: user@localhost
          ssh_public_key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCHFMFBMBnNaEMBBBB
            -----END RSA PRIVATE KEY-----
          args: up -d
          deployment_mode: docker-compose
          docker_registry_username: myuser
          docker_registry_password: mysecretpassword
          docker_registry_uri: https://registry.hub.docker.com
      - name: Assert action failed (SSH connection expected to fail in test env)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real SSH host available)"
            exit 1
          fi
          echo "PASS: action failed as expected (SSH connection refused, not input validation)"
