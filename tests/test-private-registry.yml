name: Test private registry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dummy SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "public_key<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/test_key.pub >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run action with private registry credentials
        id: action_registry
        continue-on-error: true
        uses: .
        with:
          remote_docker_host: 'user@nonexistent-host.invalid'
          remote_docker_port: '22'
          ssh_public_key: ${{ steps.keygen.outputs.public_key }}
          ssh_private_key: ${{ steps.keygen.outputs.private_key }}
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'testuser'
          docker_registry_password: 'testpassword'
          docker_registry_uri: 'https://registry.hub.docker.com'

      - name: Assert action failed (no real SSH host available)
        run: |
          echo "outcome: ${{ steps.action_registry.outcome }}"
          if [ "${{ steps.action_registry.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real SSH host), but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed when no real SSH host is available (registry inputs were accepted)"
