name: Test private registry credentials and pre-deployment command args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with private registry credentials and pre-deployment args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          remote_docker_port: '22'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test'
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcGCTBMFBsRNBMbNBMbN
            -----END RSA PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          docker_registry_username: 'myregistryuser'
          docker_registry_password: 'mysecretpassword'
          docker_registry_uri: 'https://registry.hub.docker.com'
          pre_deployment_command_args: 'config'
          keep_files: '4'

      - name: Assert action failed at SSH stage (not at validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable,
          # NOT because of input validation errors.
          # Validation of registry credentials and pre_deployment_command_args
          # should pass without error.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at SSH/connection stage (validation passed)"
          else
            echo "PASS: action completed (unexpected but not a validation failure)"
          fi
