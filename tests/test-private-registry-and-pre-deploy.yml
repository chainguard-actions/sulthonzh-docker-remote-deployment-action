name: Test private registry credentials and pre-deployment command args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: 'user@192.0.2.1'
          ssh_public_key: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC test@test'
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            dGVzdA==
            -----END OPENSSH PRIVATE KEY-----
          args: 'up -d'
          deployment_mode: 'docker-compose'
          pre_deployment_command_args: 'config'
          docker_registry_username: 'testuser'
          docker_registry_password: 'testpassword'
          docker_registry_uri: 'https://registry.hub.docker.com'
      - name: Assert action ran (failed due to unreachable host, not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the SSH host is unreachable (192.0.2.1 is TEST-NET),
          # not because of invalid input validation on registry credentials or pre_deployment_command_args.
          # We just verify the action ran (any outcome is acceptable here since SSH will time out).
          if [ "$OUTCOME" = "" ]; then
            echo "FAIL: action did not produce any outcome"
            exit 1
          fi
          echo "PASS: action ran with private registry credentials and pre_deployment_command_args inputs"
