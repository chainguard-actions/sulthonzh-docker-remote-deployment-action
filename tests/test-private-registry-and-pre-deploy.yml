name: Test private registry credentials and pre-deployment command args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with private registry credentials and pre-deployment args
        id: action
        uses: .
        continue-on-error: true
        with:
          remote_docker_host: "user@example.com"
          ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC test@test"
          ssh_private_key: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY-----"
          args: "up -d"
          deployment_mode: "docker-compose"
          pre_deployment_command_args: "config"
          docker_registry_username: "myregistryuser"
          docker_registry_password: "myregistrypassword"
          docker_registry_uri: "https://registry.hub.docker.com"
      - name: Assert action failed due to SSH connection failure (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (SSH connection to example.com should fail), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at SSH connection stage (inputs were accepted)"
