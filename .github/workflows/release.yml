name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/sulthonzh/docker-remote-deployment-action
            sulthonzh/docker-remote-deployment-action
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate changelog
        id: changelog
        run: |
          # Get tag name and sanitize it (strip newlines)
          RAW_TAG=${GITHUB_REF#refs/tags/}
          TAG=$(printf '%s' "$RAW_TAG" | tr -d '\n\r')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Get commit messages since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RAW_CHANGELOG=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s (%h)")
          else
            RAW_CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
          fi
          # Sanitize changelog: use heredoc delimiter approach to safely write multi-line value
          # We use a unique delimiter to avoid injection via EOF in commit messages
          DELIM=$(openssl rand -hex 16)
          printf 'changelog<<%s\n' "$DELIM" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RAW_CHANGELOG" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DELIM" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Usage
            See [README.md](https://github.com/sulthonzh/docker-remote-deployment-action#readme) for usage instructions.

            ## Docker Image
            ```bash
            docker pull ghcr.io/sulthonzh/docker-remote-deployment-action:${{ steps.changelog.outputs.tag }}
            ```

            ## Example
            ```yaml
            - name: Deploy Docker Compose
              uses: sulthonzh/docker-remote-deployment-action@${{ steps.changelog.outputs.tag }}
              with:
                remote_docker_host: user@server.com
                ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
                ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
                args: up -d
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
