name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint shell script
        run: bash -n docker-entrypoint.sh
        shell: bash

  dockerfile-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint Dockerfile
        run: docker build --no-cache -t test-action . || exit 1
        shell: bash

  validate-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate action.yml
        run: |
          # Basic validation: check if action.yml is valid YAML
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))" || exit 1
        shell: bash

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Security scan with ShellCheck
        run: |
          # Install ShellCheck if not available
          if ! command -v shellcheck &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --severity warning docker-entrypoint.sh || exit 1
        shell: bash

  build-image:
    runs-on: ubuntu-latest
    needs: [shell-lint, dockerfile-lint, validate-yaml]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test image runs
        run: docker run --rm $(docker build -q .) bash -c "exit 0"
        shell: bash
